[package]
name = "star-mesh-poc"
version = "0.4.0"
edition = "2026"
description = "Proof-of-concept for Star-Mesh hybrid PQ-X3DH + Double Ratchet"
license = "Apache-2.0"

[[bin]]
name = "star-mesh-poc"
path = "src/main.rs"

[dependencies]
# FIPS 203 ML-KEM-768 (RustCrypto pure-Rust implementation)
ml-kem   = { version = "0.3",  features = ["zeroize"] }
# RFC 7748 X25519 Diffie-Hellman
x25519-dalek = { version = "2", features = ["static_secrets"] }
# HKDF-SHA3-256 — matches paper.tex §3.4 and Assumption 4.2 exactly
hkdf  = "0.12"
sha3  = "0.10"
# BLAKE3 for symmetric ratchet
blake3 = "1"
# rand 0.10 + rand_core 0.10 — SysRng/ThreadRng satisfies ml-kem/kem CryptoRng bound
rand      = "0.10"
rand_core = "0.10"
# Zeroize secret material from memory
zeroize = { version = "1", features = ["derive"] }
# Constant-time comparison
subtle = "2"
